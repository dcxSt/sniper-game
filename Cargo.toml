[package]
name = "sniper_game"
version = "0.1.0"
edition = "2021"
description = "Stick-man sniper infiltration FPS — Rust + WebAssembly + WebGL2"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "=0.2.127"
js-sys = "=0.3.104"
web-sys = { version = "=0.3.104", features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "console",
  "WebGl2RenderingContext", "WebGlProgram", "WebGlShader", "WebGlBuffer",
  "WebGlVertexArrayObject", "WebGlUniformLocation", "WebGlTexture", "WebGlFramebuffer",
  "CanvasRenderingContext2d", "CanvasGradient",
  "AudioContext", "AudioDestinationNode", "AudioNode", "AudioParam", "GainNode",
  "OscillatorNode", "OscillatorType", "AudioBuffer", "AudioBufferSourceNode",
  "BiquadFilterNode", "BiquadFilterType", "StereoPannerNode",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
